&lt;/style&gt;&lt;script&gt;const roleLabels={admin:'ผู้ดูแลระบบ',lead:'หัวหน้าทีม',staff:'ผู้จัดทำ',reviewer:'ผู้ตรวจ',approver:'ผู้อนุมัติ',fleet:'ผู้ดูแลรถ',payroll:'ผู้ดูแลค่าตอบแทน'};
const permissionLabels={createPlan:'สร้างแผน',createJob:'สร้างงาน',manageSchedule:'เพิ่มและแก้กำหนดการ'};
const stages=['ส่งแผน','สำรวจ','ออกแบบ','ประมาณราคา','ส่งมอบ'];
const statusLabels={working:'กำลังทำ',blocked:'ติดขัด',review:'รอตรวจ',revision:'แก้ไข',approval:'รออนุมัติ',done:'เสร็จแล้ว'};
function isAdmin(m){return m?.status==='active'&amp;&amp;m.roles?.includes('admin');}
function hasPermission(m,p){return m?.status==='active'&amp;&amp;(isAdmin(m)||m.permissions?.includes(p));}
function canAct(m,uid,t,action){
 if(m?.status!=='active'||!t)return false;
 const own=t.ownerId===uid, role=r=&gt;m.roles?.includes(r);
 if(action==='edit'||action==='submit')return own&amp;&amp;role('staff')&amp;&amp;['working','blocked','revision'].includes(t.status);
 if(action==='review')return !own&amp;&amp;t.reviewerId===uid&amp;&amp;role('reviewer')&amp;&amp;t.status==='review';
 if(action==='approve')return !own&amp;&amp;t.reviewerId!==uid&amp;&amp;t.approverId===uid&amp;&amp;role('approver')&amp;&amp;t.status==='approval';
 return false;
}
function dayKey(d=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function daysLeft(d,today=dayKey()){return Math.round((Date.parse(d+'T00:00:00Z')-Date.parse(today+'T00:00:00Z'))/86400000);}
function urgency(t,today=dayKey()){if(t.status==='done')return 'done';if(daysLeft(t.due,today)&lt;0)return 'overdue';if(t.priority==='urgent')return 'urgent';if(daysLeft(t.due,today)&lt;=3)return 'soon';return 'normal';}
function validLink(value){if(!value)return '';const u=new URL(value);if(u.protocol!=='https:')throw Error('ใช้ลิงก์ HTTPS เท่านั้น');return u.href;}
function eligiblePersonDays(trips){const seen=new Set();for(const t of trips){if(t.status!=='done'||!t.allowanceApproved)continue;const start=t.start.slice(0,10),end=t.end.slice(0,10),n=daysLeft(end,start)+1;if(!Number.isFinite(n)||n&lt;1||n&gt;366)continue;for(let i=0;i&lt;n;i++){const d=new Date(Date.parse(start+'T00:00:00Z')+i*86400000).toISOString().slice(0,10);for(const person of t.people)seen.add(person.trim()+'|'+d);}}return seen.size;}
function validateTask(t){
 if(!t.title?.trim()||!t.teamId||!t.ownerId||!t.due)throw Error('กรอกชื่องาน ทีม ผู้จัดทำ และกำหนดส่ง');
 if(!stages.includes(t.stage)||!['plan','job'].includes(t.kind)||!['normal','important','urgent'].includes(t.priority))throw Error('ประเภทงานไม่ถูกต้อง');
 if(!Number.isFinite(t.hours)||t.hours&lt;0||t.hours&gt;10000)throw Error('ตรวจชั่วโมงที่วางแผนไว้');
 if(t.reviewerId&amp;&amp;(t.reviewerId===t.ownerId||t.reviewerId===t.approverId))throw Error('ผู้จัดทำ ผู้ตรวจ และผู้อนุมัติต้องเป็นคนละคน');
 if(t.approverId===t.ownerId)throw Error('ผู้จัดทำอนุมัติงานตนเองไม่ได้');
}

 ['เข้าสู่ระบบ','ใช้บัญชี Google ของคุณ ผู้ดูแลเป็นผู้เปิดสิทธิ์และกำหนดหน้าที่ ไม่ต้องกรอกคำขอ'],['สร้างแผนหรือรับงาน','ผู้ได้รับสิทธิ์สร้างรายการเลือกทีม ผู้จัดทำ ผู้ตรวจ ผู้อนุมัติ และกำหนดส่ง ผู้จัดทำเปิดดูได้ที่งานของฉัน'],['อัปเดตและส่งตรวจ','กรอกความก้าวหน้า สาเหตุที่ติดขัด และลิงก์เอกสาร ตรวจเช็กลิสต์ให้ครบ บันทึกก่อนกดส่งตรวจ'],['ตรวจและแก้ไข','ผู้ตรวจส่งกลับพร้อมข้อสังเกตหรือส่งต่อผู้อนุมัติ ผู้จัดทำจะได้รับแจ้งในกล่องการแจ้งเตือน'],['ติดตามกำหนดการ','สีแดงหมายถึงเกินกำหนด สีส้มคือใกล้ส่ง สีม่วงคือรอตรวจ กำหนดการเตือนในระบบขณะที่เปิดใช้งาน'],['การเดินทาง','ขอรถจากงาน ระบุทะเบียน เวลา ผู้เดินทาง และเลขไมล์ ผู้จัดรถตรวจคิวก่อนอนุมัติ'],['การเปิดเอกสาร','ลิงก์แบบ PDF / BOQ ต้องแชร์สิทธิ์ให้ผู้ตรวจด้วย การเปิด PDF จากเครื่องใช้ตรวจบนอุปกรณ์นั้นเท่านั้น']].map(([t,d],i)=&gt;'&lt;div class=&quot;help-step&quot;&gt;&lt;span&gt;'+(i+1)+'&lt;/span&gt;&lt;div&gt;&lt;h3&gt;'+t+'&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;'+d+'&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;').join(''));

function recentChart(){
 const bins=Array.from({length:6},(_,i)=&gt;{const d=new Date();d.setDate(d.getDate()-5+i);return {key:dayKey(d),label:d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}),created:0,done:0};});
 const localDay=v=&gt;v&amp;&amp;!Number.isNaN(Date.parse(v))?dayKey(new Date(v)):'';
 for(const t of list('tasks')){const created=bins.find(b=&gt;b.key===localDay(t.createdAt));if(created)created.created++;for(const h of t.history||[]){if(h.action!=='อนุมัติแล้ว')continue;const b=bins.find(b=&gt;b.key===localDay(h.at));if(b)b.done++;}}
 const max=Math.max(1,...bins.flatMap(b=&gt;[b.created,b.done]));const any=bins.some(b=&gt;b.created||b.done);

<script>(() => {

  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
